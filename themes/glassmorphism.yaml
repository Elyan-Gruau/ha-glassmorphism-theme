glassmorphism:
  # Dark-only. HA forces light mode for any theme without a modes.dark
  # section, which leaves its light-mode surface tokens (white toasts, menus,
  # inputs...) underneath everything this file doesn't override. A dark mode
  # with no light mode makes HA always pick dark; the top-level vars below
  # still apply on top of it.
  modes:
    dark: {}

  mainPadding: "1rem"

  # Noise: the grain tile is embedded as a base64 data URI, so the theme
  # works straight out of HACS, nothing to copy into /config/www.
  # Regenerate with: python3 tools/embed_noise.py
  # BEGIN noise (generated by tools/embed_noise.py -- do not edit by hand)
  ha-card-background: 'linear-gradient(0deg, rgba(81,81,81,0) 15%, rgba(0,0,0,0.1)), url("data:image/png;base64,"), rgba(0,0,0,0.25)'
  glass-noise-image: 'url("data:image/png;base64,")'
  # END noise

  card-background-color: "rgba(0,0,0,0.25)"

  ha-card-backdrop-filter: "blur(25px) saturate(120%)"
  ha-card-box-shadow: >-
    rgb(255,255,255) 0px 0px 11px -10px inset,
    rgb(0,0,0) 0px 0px 12px -8px
  ha-card-border-width: "0px"
  ha-card-border-radius: "1rem"

  primary-text-color: "rgba(255,255,255,0.95)"
  secondary-text-color: "rgba(255,255,255,0.65)"
  primary-color: "#F7D6AF"

  # Base app chrome: without these, HA's default light background, sidebar
  # and header show through everywhere outside the cards themselves.
  primary-background-color: "#0b0c10"
  secondary-background-color: "#151515"
  divider-color: "rgba(255,255,255,0.12)"
  disabled-text-color: "rgba(255,255,255,0.38)"

  app-header-background-color: "rgba(11,12,16,0.6)"
  app-header-text-color: "rgba(255,255,255,0.95)"
  # .header's background-color can't hold the gradient+noise texture (that
  # needs card-mod below), but blur, the active-tab indicator and the
  # scrolled-state shadow are plain theme vars -- no card-mod required for
  # those, so the header still gets most of the glass look even without it.
  app-header-backdrop-filter: "blur(25px) saturate(120%)"
  app-header-selection-bar-color: "#F7D6AF"
  bar-box-shadow: "0px 6px 10px -11px rgba(0,0,0,0.8)"

  sidebar-background-color: "rgba(11,12,16,0.6)"
  sidebar-text-color: "rgba(255,255,255,0.85)"
  sidebar-icon-color: "rgba(255,255,255,0.65)"
  sidebar-selected-icon-color: "#F7D6AF"
  sidebar-selected-text-color: "#F7D6AF"

  # Dialogs (more-info, confirmations, settings) have their own surface and
  # blur, separate from ha-card -- without these they default to near
  # see-through with no blur at all.
  ha-dialog-surface-background: "rgba(16,17,22,0.55)"
  ha-dialog-surface-backdrop-filter: "blur(25px) saturate(120%)"
  ha-dialog-border-radius: "1rem"
  dialog-box-shadow: >-
    rgb(255,255,255) 0px 0px 11px -10px inset,
    rgb(0,0,0) 0px 0px 12px -8px

  # Toggle switches. The track has no box-shadow hook in ha-switch, so depth
  # comes from value contrast instead: track always dark/recessed, thumb
  # always light/raised, in both states -- only the hue shifts to gold when
  # checked. The thumb does get a real bezel via its one exposed shadow var.
  ha-switch-background-color: "rgba(0,0,0,0.45)"
  ha-switch-background-color-hover: "rgba(0,0,0,0.55)"
  ha-switch-border-color: "rgba(255,255,255,0.06)"
  ha-switch-thumb-background-color: "rgba(235,235,235,0.92)"
  ha-switch-thumb-background-color-hover: "rgba(255,255,255,0.96)"
  ha-switch-thumb-border-color: "rgba(0,0,0,0.3)"
  ha-switch-thumb-box-shadow: >-
    0px 1px 2px 0px rgba(0,0,0,0.45),
    0px 0px 4px -1px rgba(255,255,255,0.5) inset
  ha-switch-checked-background-color: "#7a5c2e"
  ha-switch-checked-background-color-hover: "#8a6a3a"
  ha-switch-checked-border-color: "rgba(255,255,255,0.18)"
  ha-switch-checked-thumb-background-color: "#F7D6AF"
  ha-switch-checked-thumb-background-color-hover: "#ffe6bf"
  ha-switch-checked-thumb-border-color: "rgba(0,0,0,0.25)"

  # Kill the stray default (often blue/teal) focus ring so it matches the
  # accent instead, across switches, buttons and inputs.
  ha-color-focus: "#F7D6AF"
  wa-focus-ring-color: "#F7D6AF"

  # The select/menu popup surface already falls back to card-background-color,
  # but some components read this token directly -- set explicitly so the
  # popup never lands on its own white fallback. No blur hook exists here.
  # Text inputs (search bar included) read this same surface token for their
  # fill, so it covers both.
  wa-color-surface-raised: "rgba(16,17,22,0.78)"

  # Input/search bar border defaults to a near-white neutral token -- too
  # loud against the glass. A faint translucent rim instead.
  wa-form-control-border-color: "rgba(255,255,255,0.12)"

  # Neutral "fill" tokens default to near-white (Material's light-mode
  # tonal scale, same family as the primary one fixed for buttons earlier).
  # These two tiers alone cover: the history/logbook "no targets" banner,
  # the hover background on integration cards, and the hover background on
  # dropdown/list items -- all three read one of these two tiers.
  ha-color-fill-neutral-quiet-resting: "rgba(255,255,255,0.06)"
  ha-color-fill-neutral-quiet-hover: "rgba(255,255,255,0.10)"
  ha-color-fill-neutral-quiet-active: "rgba(255,255,255,0.06)"
  ha-color-fill-neutral-normal-resting: "rgba(255,255,255,0.08)"
  ha-color-fill-neutral-normal-hover: "rgba(255,255,255,0.14)"
  ha-color-fill-neutral-normal-active: "rgba(255,255,255,0.08)"

  # Progress bar track (the unfilled portion) has its own dedicated hook;
  # the filled indicator already follows the gold accent via the primary
  # token fixed earlier.
  ha-progress-bar-track-color: "rgba(255,255,255,0.12)"

  # ha-button's "brand" (primary) fill no longer reads primary-color -- it
  # reads this separate token scale instead. HA always renders white text on
  # the "loud" fill, so that step stays dark enough to read; quiet/normal
  # fills stay translucent accent tints with cream text on top.
  ha-color-fill-primary-quiet-resting: "rgba(247,214,175,0.10)"
  ha-color-fill-primary-quiet-hover: "rgba(247,214,175,0.16)"
  ha-color-fill-primary-quiet-active: "rgba(247,214,175,0.10)"
  ha-color-fill-primary-normal-resting: "rgba(247,214,175,0.20)"
  ha-color-fill-primary-normal-hover: "rgba(247,214,175,0.28)"
  ha-color-fill-primary-normal-active: "rgba(247,214,175,0.20)"
  ha-color-fill-primary-loud-resting: "#5c3f1f"
  ha-color-fill-primary-loud-hover: "#4a331a"
  ha-color-fill-primary-loud-active: "#5c3f1f"
  ha-color-on-primary-quiet: "#F7D6AF"
  ha-color-on-primary-normal: "#F7D6AF"

  # Dark gradient wallpaper, no photo required. Override this key in your
  # own theme if you'd rather use a picture
  # (center / cover no-repeat fixed url("/local/your-image.jpg")).
  lovelace-background: "linear-gradient(180deg, #0b0c10 0%, #151515 45%, #15151e 100%) fixed"

  # Header gradient+noise texture (same recipe as the cards) and its
  # always-on glass bezel -- the one part that genuinely needs card-mod,
  # since background-color alone can't carry a gradient or an image.
  card-mod-theme: glassmorphism
  card-mod-root: |
    .header {
      background: var(--ha-card-background) !important;
      box-shadow: rgb(255,255,255) 0px 0px 11px -10px inset,
                  rgb(0,0,0) 0px 0px 12px -8px;
    }

  # Media control card seek bar. The card hardcodes its own light-grey
  # --ha-slider-track-color, so no theme var can reach it -- card-mod has to
  # override it from inside the card. The track is pressed into the glass
  # (dark inset top-left, faint white catch-light bottom-right); the filled
  # indicator sits on top of it with a soft bevel. !important because the
  # card's adopted stylesheet otherwise wins over card-mod's <style>.
  #
  # Logbook sticky date header ("Today · ..."), e.g. the Security dashboard's
  # Activity sidebar. It's painted with plain card-background-color, so rows
  # scrolling under it show straight through. It sits two shadow roots deep
  # (ha-logbook > ha-logbook-renderer), hence the yaml form and its $ path.
  card-mod-card-yaml: |
    .: |
      ha-slider {
        --ha-slider-track-color: rgba(0,0,0,0.5) !important;
      }
      ha-slider::part(track) {
        box-shadow: -1px 1px 5px -1px rgb(0,0,0) inset,
                    1px -1px 5px -1px rgba(255,255,255,0.12) inset;
      }
      ha-slider::part(indicator) {
        box-shadow: 1px 2px 6px -4px rgba(255,255,255,0.67) inset,
                    0px 0px 6px -3px rgba(0,0,0,0.53) inset;
      }
    ha-logbook $ ha-logbook-renderer $: |
      .floating-date {
        background-color: rgba(16,17,22,0.55) !important;
        backdrop-filter: blur(25px) saturate(120%);
        -webkit-backdrop-filter: blur(25px) saturate(120%);
        box-shadow: rgb(255,255,255) 0px -8px 11px -10px inset,
                    0px 6px 10px -11px rgba(0,0,0,0.8);
      }
